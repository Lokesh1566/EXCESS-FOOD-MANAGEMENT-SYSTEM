{% extends "base.html" %}
{% block title %}Donate Food — FoodRescue{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <h2 class="fw-bold mb-4"><i class="bi bi-plus-circle text-success me-2"></i>List a Food Donation</h2>
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Food Type *</label>
                                <select name="food_type" class="form-select" required>
                                    <option value="cooked_meal">Cooked Meal</option>
                                    <option value="vegetables">Vegetables</option>
                                    <option value="fruits">Fruits</option>
                                    <option value="bakery">Bakery Items</option>
                                    <option value="packaged">Packaged Food</option>
                                    <option value="dairy">Dairy Products</option>
                                    <option value="grains">Grains & Rice</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Quantity *</label>
                                <input type="text" name="quantity" class="form-control" placeholder="e.g., 20 plates, 5 kg" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Description *</label>
                                <textarea name="description" class="form-control" rows="3" placeholder="What food are you donating? Any special notes?" required></textarea>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label">Pickup Address *</label>
                                <input type="text" name="pickup_address" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">City *</label>
                                <input type="text" name="city" class="form-control" value="{{ current_user.city or '' }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Available for (hours) *</label>
                                <select name="expiry_hours" class="form-select">
                                    <option value="2">2 hours</option>
                                    <option value="4">4 hours</option>
                                    <option value="6">6 hours</option>
                                    <option value="12">12 hours</option>
                                    <option value="24" selected>24 hours</option>
                                    <option value="48">48 hours</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 mt-4 btn-lg">
                            <i class="bi bi-heart me-2"></i>Post Donation
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
