{% extends "base.html" %}
{% block title %}Profile — FoodRescue{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h2 class="fw-bold mb-4">Edit Profile</h2>
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3"><label class="form-label">Name</label><input type="text" name="name" class="form-control" value="{{ current_user.name }}" required></div>
                        <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" value="{{ current_user.email }}" disabled></div>
                        <div class="mb-3"><label class="form-label">Phone</label><input type="tel" name="phone" class="form-control" value="{{ current_user.phone or '' }}"></div>
                        <div class="mb-3"><label class="form-label">Organization</label><input type="text" name="organization" class="form-control" value="{{ current_user.organization or '' }}"></div>
                        <div class="mb-3"><label class="form-label">Address</label><input type="text" name="address" class="form-control" value="{{ current_user.address or '' }}"></div>
                        <div class="mb-3"><label class="form-label">City</label><input type="text" name="city" class="form-control" value="{{ current_user.city or '' }}"></div>
                        <button type="submit" class="btn btn-success w-100">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
